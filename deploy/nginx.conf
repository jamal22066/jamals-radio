# nginx config for the radio-web container. Only reachable at 127.0.0.1:9180 on the host;
# the public goes through Cloudflare Tunnel, which also does TLS and passes the original Host header.
# The canonical address is https://jamalsblog.com. Any other hostname routed here
# (www.jamalsblog.com, radio.jamalsblog.com) gets a permanent redirect that keeps the path.

# Play stats (see playStatsUrl in config.js): one JSON line per event.
# q is the raw query string sent by app.js, vc the visitor's country from Cloudflare, and ip the
# visitor's IP (CF-Connecting-IP; $remote_addr is only the local tunnel). ./stats.sh looks up city and
# ISP for each IP in offline DB-IP databases on the machine that runs it.
log_format plays escape=json '{"t":"$time_iso8601","q":"$args","vc":"$http_cf_ipcountry","ip":"$http_cf_connecting_ip"}';
limit_req_zone $http_cf_connecting_ip zone=plays:1m rate=30r/m;

server {
  listen 80 default_server;
  server_tokens off;
  return 301 https://jamalsblog.com$request_uri;
}

server {
  listen 80;
  # localhost/127.0.0.1 so on-box health checks (deploy.sh) get the site, not the redirect
  server_name jamalsblog.com localhost 127.0.0.1;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # repo-only files that live in the same directory
  location ~ ^/(scripts|deploy)/ { return 404; }
  location ~ \.(md|sh)$ { return 404; }

  # /var/log/radio is ~/radio-logs on the host (deploy/radio.service), read by ./stats.sh
  # `return` would run before limit_req, so hop to a named location via try_files (which runs after it).
  location = /api/play {
    limit_req zone=plays burst=20 nodelay;
    limit_req_status 429;
    access_log off;
    try_files /__no_such_file__ @play_logged;
  }
  location @play_logged {
    access_log /var/log/radio/plays.log plays;
    add_header Cache-Control "no-store" always;
    return 204;
  }

  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location /data/   { add_header Cache-Control "public, max-age=3600"; }
  location /vendor/ { add_header Cache-Control "public, max-age=2592000"; }
  location ~ \.(js|css|svg|webmanifest)$ { add_header Cache-Control "public, max-age=300"; }
}
