# nginx config for the radio-web container. Only reachable at 127.0.0.1:9180 on the host;
# the public goes through Cloudflare Tunnel (radio.jamalsblog.com), which also does TLS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # repo-only files that live in the same directory
  location ~ ^/(scripts|deploy)/ { return 404; }
  location ~ \.(md|sh)$ { return 404; }

  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location /data/   { add_header Cache-Control "public, max-age=3600"; }
  location /vendor/ { add_header Cache-Control "public, max-age=2592000"; }
  location ~ \.(js|css|svg|webmanifest)$ { add_header Cache-Control "public, max-age=300"; }
}
